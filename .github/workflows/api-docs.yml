name: API Docs

on:
  push:
    branches: [ main, develop ]
    paths: [ 'backend/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'backend/**' ]

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Generate OpenAPI spec and Postman collection
      working-directory: ./backend
      env:
        SQLX_OFFLINE: 'true'
      run: cargo run --bin export_openapi -- ../docs/api

    - name: Upload API docs
      uses: actions/upload-artifact@v4
      with:
        name: api-docs
        path: docs/api/
