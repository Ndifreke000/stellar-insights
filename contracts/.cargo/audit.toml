[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste 1.0.15 unmaintained: pulled in transitively by the official
                          # soroban-sdk -> soroban-env-host -> ark-bls12-381/ark-ff (arkworks)
                          # dependency chain (`cargo tree -i paste`). Not a direct or
                          # controllable dependency of this project -- fixing it requires an
                          # upstream soroban-sdk/arkworks release. No known vulnerability, only
                          # an "unmaintained" advisory.
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5 timing variability: pulled in only via the official
                          # soroban-sdk -> soroban-env-host -> k256/p256 -> elliptic-curve chain
                          # (`cargo tree -i crypto-bigint@0.5.5`). The patched line (>=0.7.6) needs a
                          # RustCrypto/soroban-env-host upgrade upstream; contracts here never sign
                          # with secret keys, so there is no secret-dependent timing to observe.
    "RUSTSEC-2026-0543", # chrono unmaintained (no fixed release exists): stale Cargo.lock entry,
                          # not part of the build graph for any target (`cargo tree -i chrono
                          # --target all` is empty). Informational "unmaintained" advisory only.
]
