name: Nightly E2E - Self-Serve Funnel

# SEP-10 sign-in → create API key → preflight with key, end to end against a
# real running backend. Covers the self-serve funnel described in issue
# #2646; see tests/e2e/sep10-apikey-preflight.test.ts.
on:
  schedule:
    - cron: '0 3 * * *' # Nightly at 3 AM UTC
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build backend
        working-directory: backend
        run: cargo build --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Configure test environment
        working-directory: backend
        run: |
          cp .env.example .env
          echo "DATABASE_URL=sqlite:./e2e_test.db" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "RPC_MOCK_MODE=true" >> .env

      - name: Run database migrations
        working-directory: backend
        run: |
          cargo install sqlx-cli --no-default-features --features sqlite
          sqlx migrate run

      - name: Start backend server
        working-directory: backend
        run: |
          ./target/release/payraider-backend &
          echo $! > server.pid

      - name: Wait for backend to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'

      - name: Run self-serve funnel E2E test
        env:
          API_BASE_URL: http://localhost:8080
        run: npx playwright test --project=backend-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop backend server
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
