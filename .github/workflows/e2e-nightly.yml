name: Nightly E2E - Self-Serve Funnel

# SEP-10 sign-in → create API key → preflight with key, end to end against a
# real running backend. Covers the self-serve funnel described in issue
# #2646; see tests/e2e/sep10-apikey-preflight.test.ts.
on:
  schedule:
    - cron: '0 3 * * *' # Nightly at 3 AM UTC
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build backend
        working-directory: backend
        run: cargo build --release

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Configure test environment
        working-directory: backend
        run: |
          cp .env.example .env
          # Drop placeholder values (the server refuses to start with CHANGE_ME secrets)
          # and override per-test settings in place: dotenv keeps the first value for a
          # key, so appending duplicates would be silently ignored.
          sed -i -E '/^[A-Z0-9_]+=["'"'"']?CHANGE_ME/d' .env
          set_env() { sed -i "/^$1=/d" .env; echo "$1=$2" >> .env; }
          set_env DATABASE_URL "sqlite:./e2e_test.db"
          set_env REDIS_URL redis://localhost:6379
          set_env RPC_MOCK_MODE true
          set_env JWT_SECRET "$(openssl rand -base64 48 | tr -d '\n')"
          set_env ENCRYPTION_KEY "$(openssl rand -hex 32)"
          # Public key only (no secret): enables the SEP-10 wallet sign-in routes.
          set_env SEP10_SERVER_PUBLIC_KEY GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN

      - name: Run database migrations
        working-directory: backend
        run: |
          cargo install sqlx-cli --no-default-features --features sqlite --locked
          sqlx database create
          sqlx migrate run

      - name: Start backend server
        working-directory: backend
        run: |
          ./target/release/payraider-backend &
          echo $! > server.pid

      - name: Wait for backend to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'

      - name: Run self-serve funnel E2E test
        env:
          API_BASE_URL: http://localhost:8080
        run: npx playwright test --project=backend-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop backend server
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
