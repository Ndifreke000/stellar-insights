# AWS Secrets Manager SecretStore and ExternalSecret configuration
# Synchronizes secrets from AWS Secrets Manager into Kubernetes Secret.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: payraider
  labels:
    app: payraider
    component: secrets-management
spec:
  provider:
    aws:
      service: SecretsManager
      region: "us-east-1"
      auth:
        jwt:
          serviceAccountRef:
            name: payraider-backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payraider-aws-secrets
  namespace: payraider
  labels:
    app: payraider
    component: secrets-management
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: payraider-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: "payraider/production"
        property: DATABASE_URL
    - secretKey: redis-url
      remoteRef:
        key: "payraider/production"
        property: REDIS_URL
    - secretKey: jwt-secret
      remoteRef:
        key: "payraider/production"
        property: JWT_SECRET
    - secretKey: encryption-key
      remoteRef:
        key: "payraider/production"
        property: ENCRYPTION_KEY
    - secretKey: sep10-server-public-key
      remoteRef:
        key: "payraider/production"
        property: SEP10_SERVER_PUBLIC_KEY
    - secretKey: stellar-source-secret-key
      remoteRef:
        key: "payraider/production"
        property: STELLAR_SOURCE_SECRET_KEY
    - secretKey: price-feed-api-key
      remoteRef:
        key: "payraider/production"
        property: PRICE_FEED_API_KEY
    - secretKey: slack-webhook-url
      remoteRef:
        key: "payraider/production"
        property: SLACK_WEBHOOK_URL
    - secretKey: telegram-bot-token
      remoteRef:
        key: "payraider/production"
        property: TELEGRAM_BOT_TOKEN
