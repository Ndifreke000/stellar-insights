# Deploy the PayRaider plugin to Fly.io. Run from the sdk/ directory:
#
#   fly launch --no-deploy --copy-config --config mcp-server/fly.toml
#   fly secrets set PAYRAIDER_BASE_URL=https://your-backend.example.com \
#                   PAYRAIDER_MCP_AUTH_TOKEN=$(openssl rand -hex 32)
#   fly deploy --config mcp-server/fly.toml --dockerfile mcp-server/Dockerfile
#
app = "payraider-mcp"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PAYRAIDER_NETWORK = "testnet"
  PORT = "3333"

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "3s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
