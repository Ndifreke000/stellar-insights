apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payraider-backend
  namespace: payraider
  labels:
    app: payraider
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payraider-backend
  # Pinned to 1/1 (effectively disabled): SQLite (see
  # docs/adr/0001-sqlite-vs-postgres.md) permits exactly one writer,
  # and the backend-data PVC is ReadWriteOnce, so a scaled-up second
  # pod could not mount it. Do not raise these without first adding a
  # real multi-writer story.
  minReplicas: 1
  maxReplicas: 1
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Aggressive scale-up policy to handle sudden traffic spikes — default 5-minute window caused 503s under burst load
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 4
        periodSeconds: 60
