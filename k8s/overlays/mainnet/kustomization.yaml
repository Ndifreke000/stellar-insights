apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payraider-mainnet

bases:
- ../../

commonLabels:
  environment: mainnet

resources:
- namespace.yaml

patches:
- path: backend-patch.yaml
- path: hpa-patch.yaml
- path: network-policy-patch.yaml
- path: redis-patch.yaml

images:
- name: payraider/backend
  newTag: v1.0.0
- name: payraider/frontend
  newTag: v1.0.0

configMapGenerator:
- name: payraider-config
  behavior: merge
  literals:
  - stellar-network=mainnet
  # Keep the API access log (audit trail) at info while the rest stays at warn.
  - rust-log=warn,api_access=info
  # High-traffic mainnet: log 20% of fast successful requests (errors/slow always logged).
  - api-log-sample-rate=0.2
  - cors-allowed-origins=https://payraider.com
