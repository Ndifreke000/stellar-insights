# Per-entrypoint gas regression thresholds (#2601, #2787).
#
# Each value is the maximum allowed increase, as a fraction, in every gated
# metric — CPU instructions, memory bytes, ledger entries read/written and
# bytes read/written — over the baseline in docs/GAS_COSTS.md.
# 0.05 = CI fails if an entrypoint gets more than 5% more expensive.
#
# Every entrypoint measured by benches/gas_benchmarks.rs must be listed here,
# and every entry here must be measured — scripts/check_gas_regression.py fails
# on either mismatch so a new entrypoint can't slip in unguarded.
#
# Tighten an entry rather than loosen it. If a change legitimately costs more,
# update the baseline (see docs/GAS_COSTS.md) instead of raising the threshold.

[entrypoints]
"payraider::initialize" = 0.05
"payraider::get_version" = 0.05
"payraider::submit_snapshot" = 0.05
"payraider::get_snapshot" = 0.05
"payraider::latest_snapshot" = 0.05
"payraider::get_admin" = 0.05
"payraider::propose_admin" = 0.05
"payraider::accept_admin" = 0.05
"payraider::cancel_admin_transfer" = 0.05
"payraider::get_pending_admin" = 0.05
"payraider::get_latest_epoch" = 0.05
"payraider::pause" = 0.05
"payraider::unpause" = 0.05
"payraider::schedule_upgrade" = 0.05
"payraider::execute_upgrade" = 0.05
"payraider::cancel_upgrade" = 0.05
"payraider::get_pending_upgrade" = 0.05
"payraider::get_upgrade_delay" = 0.05
"payraider::set_upgrade_delay" = 0.05
"payraider::get_storage_version" = 0.05
"payraider::migrate" = 0.05
"payraider::set_governance" = 0.05
"payraider::get_governance" = 0.05
"payraider::set_admin_by_governance" = 0.05
"payraider::set_paused_by_governance" = 0.05
"payraider::is_paused" = 0.05
"payraider::add_submitter" = 0.05
"payraider::remove_submitter" = 0.05
"payraider::rotate_submitter" = 0.05
"payraider::get_submitters" = 0.05
"payraider::bump_ttl" = 0.05
"payraider::get_role_holders" = 0.05
"payraider::grant_role" = 0.05
"payraider::revoke_role" = 0.05
"payraider::has_role" = 0.05
"payraider::get_metadata" = 0.05
"payraider::get_contract_info" = 0.05
