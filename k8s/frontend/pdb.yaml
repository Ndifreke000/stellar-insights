apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payraider-frontend
  namespace: payraider
  labels:
    app: payraider
    component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payraider
      component: frontend
  unhealthyPodEvictionPolicy: IfHealthyBudget
