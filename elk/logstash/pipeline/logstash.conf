# Input: Syslog with JSON logs from application
input {
  tcp {
    port => 5000
    codec => json_lines
    type => "json"
  }
  
  udp {
    port => 5000
    codec => json_lines
    type => "json"
  }
}

# Filter: Process and redact sensitive data
filter {
  # Parse timestamp if present
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
  
  # Extract request_id as a searchable field
  if [request_id] {
    mutate {
      add_field => { "[@metadata][request_id]" => "%{request_id}" }
    }
  }
  
  # Redact sensitive fields that might slip through despite app-side redaction
  mutate {
    # Remove common sensitive patterns from all fields
    gsub => [
      "[message]", "(?i)authorization[\":].*?[\"']?[a-zA-Z0-9\-._~\+\/]+=*[\"']?", "REDACTED_AUTH",
      "[message]", "(?i)password[\":].*?[\"']?[^\"',}]*[\"']?", "REDACTED_PASSWORD",
      "[message]", "(?i)api[_-]?key[\":].*?[\"']?[^\"',}]*[\"']?", "REDACTED_API_KEY",
      "[message]", "(?i)secret[\":].*?[\"']?[^\"',}]*[\"']?", "REDACTED_SECRET",
      "[message]", "(?i)token[\":].*?[\"']?[^\"',}]*[\"']?", "REDACTED_TOKEN"
    ]
  }
  
  # Drop logs from health check endpoints (reduce noise)
  if [path] == "/health" or [path] == "/ready" {
    drop {}
  }
  
  # Add environment metadata
  mutate {
    add_field => {
      "application" => "stellar-insights"
      "service" => "backend"
      "component" => "api"
    }
  }
}

# Output: Send to Elasticsearch
output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "stellar-insights-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Also log to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
