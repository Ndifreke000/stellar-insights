# HashiCorp Vault SecretStore and ExternalSecret configuration
# Synchronizes secrets from HashiCorp Vault KV v2 engine into Kubernetes Secret.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: payraider
  labels:
    app: payraider
    component: secrets-management
spec:
  provider:
    vault:
      server: "https://vault.payraider.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "payraider-backend"
          serviceAccountRef:
            name: payraider-backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payraider-vault-secrets
  namespace: payraider
  labels:
    app: payraider
    component: secrets-management
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: payraider-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app: payraider
  data:
    - secretKey: database-url
      remoteRef:
        key: database/payraider
        property: database-url
    - secretKey: redis-url
      remoteRef:
        key: redis/payraider
        property: redis-url
    - secretKey: jwt-secret
      remoteRef:
        key: encryption
        property: jwt_secret
    - secretKey: encryption-key
      remoteRef:
        key: encryption
        property: master_key
    - secretKey: sep10-server-public-key
      remoteRef:
        key: stellar/sep10
        property: server-public-key
    - secretKey: stellar-source-secret-key
      remoteRef:
        key: stellar/deployer
        property: secret-key
    - secretKey: price-feed-api-key
      remoteRef:
        key: api/price-feed
        property: api-key
    - secretKey: slack-webhook-url
      remoteRef:
        key: notifications/slack
        property: webhook-url
    - secretKey: telegram-bot-token
      remoteRef:
        key: notifications/telegram
        property: bot-token
