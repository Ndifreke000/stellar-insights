name: Deploy Testnet

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'k8s/**'
      - '.github/workflows/deploy-testnet.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: stellar-insights-backend
  K8S_OVERLAY: k8s/overlays/testnet
  K8S_NAMESPACE: stellar-insights-testnet

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run unit and integration tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-value-at-least-32-characters-long
          DATABASE_URL: "sqlite::memory:"
        # Deliberately not --all-features: the legacy_sep10_tests feature
        # gates tests/sep10_test.rs, which targets a pre-consolidation
        # crate layout (stellar_base/stellar_analytics) that no longer
        # exists in this repo and has not compiled for some time.
        run: cargo test --features sep-integration

  build-and-deploy:
    name: Build, Push & Deploy Testnet
    needs: test
    runs-on: ubuntu-latest
    environment: testnet

    steps:
      - uses: actions/checkout@v4

      # ── Issue #1844: Pre-flight validation ──────────────────────────────────
      # Verify all required secrets and env vars are present before proceeding.
      - name: Validate deployment configuration
        run: |
          echo "Checking required configuration..."
          MISSING=""
          [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ] && MISSING="$MISSING AWS_ACCOUNT_ID"
          [ -z "${{ secrets.KUBECONFIG_TESTNET }}" ] && MISSING="$MISSING KUBECONFIG_TESTNET"
          [ -z "${{ vars.TESTNET_BACKEND_URL }}" ] && MISSING="$MISSING TESTNET_BACKEND_URL (vars)"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets/vars:$MISSING"
            echo "::error::Configure these in the repo Settings > Secrets and Variables > Actions"
            exit 1
          fi
          echo "✓ All required configuration present"
          echo "  AWS_REGION: $AWS_REGION"
          echo "  ECR_REPOSITORY: $ECR_REPOSITORY"
          echo "  K8S_OVERLAY: $K8S_OVERLAY"
          echo "  K8S_NAMESPACE: $K8S_NAMESPACE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/terraform-executor
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:testnet-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:testnet-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_TESTNET }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply testnet overlay
        run: |
          kubectl kustomize "${{ env.K8S_OVERLAY }}" \
            | sed "s|stellar-insights/backend:testnet|${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:testnet-${{ github.sha }}|g" \
            | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/testnet-stellar-insights-backend \
            -n "${{ env.K8S_NAMESPACE }}" --timeout=10m

      - name: Run backend smoke tests
        working-directory: backend
        env:
          TESTNET_API_URL: ${{ vars.TESTNET_BACKEND_URL }}
          TESTNET_API_KEY: ${{ secrets.TESTNET_API_KEY }}
        run: cargo test --features testnet-smoke

      - name: Output deployment URL
        run: |
          echo "::notice::Testnet backend deployed at ${{ vars.TESTNET_BACKEND_URL }}"
          echo "TESTNET_BACKEND_URL=${{ vars.TESTNET_BACKEND_URL }}" >> "$GITHUB_ENV"

      - name: Post Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping notification"
            exit 0
          fi
          STATUS="${{ job.status }}"
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"Testnet deploy ${STATUS}: \`${{ github.repository }}\` @ \`${{ github.sha }}\` by ${{ github.actor }}\"}"

      - name: Deployment summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Testnet Deployment

          | Field | Value |
          |-------|-------|
          | **Status** | \`${{ job.status }}\` |
          | **Image** | \`testnet-${{ github.sha }}\` |
          | **Overlay** | \`${{ env.K8S_OVERLAY }}\` |
          | **Actor** | @${{ github.actor }} |
          EOF
