name: Secret & Credential Scanning

# Consolidates the old `Secret Scanning` and `Credential Scan` workflows
# (secret-scan.yml, credential-scan.yml) into one file.
#
# They are NOT fully redundant despite the similar names: `trufflehog`
# scans for verified secrets across the pushed/PR diff, while
# `tracked-credentials` runs scripts/check-git-credentials.sh, which
# deliberately covers a different, narrower case (credentials committed to
# tracked files; see issue #1875 and docs/runbooks/credential-rotation.md —
# it intentionally skips remote URLs, which `git remote`-based checks can't
# validate in a fresh CI checkout anyway). Both jobs are kept with their
# exact original steps; only the file count changed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # On a push to main, "main..HEAD" is empty and the action aborts.
          # Scan the pushed range instead; for pull requests the action
          # derives the range itself.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          head: ${{ github.event_name == 'push' && github.event.after || '' }}
          extra_args: --only-verified

  tracked-credentials:
    name: Scan tracked files for embedded credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git grep only sees the checked-out tree, so a shallow clone is
          # enough — this catches a token being introduced, not one already
          # buried in history. GitHub secret scanning covers the latter.
          fetch-depth: 1

      - name: Run credential check
        run: |
          chmod +x scripts/check-git-credentials.sh
          scripts/check-git-credentials.sh --tracked
