apiVersion: apps/v1
kind: Deployment
metadata:
  name: payraider-backend
  namespace: payraider
  labels:
    app: payraider
    component: backend
    version: v1
spec:
  # Pinned to 1: SQLite (docs/adr/0001-sqlite-vs-postgres.md) permits
  # exactly one writer and there is no shared storage for multiple
  # replicas to safely share one database file.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: the backend-data PVC below is
    # ReadWriteOnce, so a new pod cannot mount it until the old pod
    # releases it. RollingUpdate's maxSurge would deadlock trying to
    # schedule a second pod against an already-mounted RWO volume.
    # This means brief downtime on every deploy -- the real cost of a
    # single-writer file database, not a bug to route around.
    type: Recreate
  selector:
    matchLabels:
      app: payraider
      component: backend
  template:
    metadata:
      labels:
        app: payraider
        component: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: payraider-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      
      # Init container for database migrations
      initContainers:
      - name: db-migration
        image: payraider/backend:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Running database migrations..."
            sqlx migrate run
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: payraider-secrets
              key: database-url
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      
      containers:
      - name: backend
        image: payraider/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        # Database Configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: payraider-secrets
              key: database-url
        
        # Redis Configuration
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: payraider-secrets
              key: redis-url
        
        # JWT Secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: payraider-secrets
              key: jwt-secret
        
        # Encryption Key
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: payraider-secrets
              key: encryption-key
        
        # Server Configuration
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "8080"
        
        # Stellar Network Configuration
        - name: STELLAR_NETWORK
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: stellar-network
        
        - name: STELLAR_RPC_URL_MAINNET
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: stellar-rpc-url-mainnet
        
        - name: STELLAR_HORIZON_URL_MAINNET
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: stellar-horizon-url-mainnet
        
        # Logging
        - name: RUST_LOG
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: rust-log
        
        - name: LOG_FORMAT
          value: "json"
        
        # CORS Configuration
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: cors-allowed-origins
        
        # Database Pool Configuration
        - name: DB_POOL_MAX_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: db-pool-max-connections
        
        - name: DB_POOL_MIN_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: db-pool-min-connections
        
        # Admin IP Whitelist
        - name: ADMIN_IP_WHITELIST
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: admin-ip-whitelist
        
        - name: ADMIN_IP_TRUST_PROXY
          value: "true"
        
        # Observability
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: otel-endpoint
              optional: true
        
        # Health check endpoints
        # Threshold increased to tolerate GC pauses under mainnet load (was failureThreshold: 2, periodSeconds: 10)
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 5
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        # Startup probe for slow-starting containers
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30  # 150 seconds max startup time
        
        # Resource management
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "1Gi"
            cpu: "1000m"
            ephemeral-storage: "2Gi"
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /data

      # Litestream sidecar: continuous replication of the SQLite database
      # to S3 (ADR 0001's durability hardening item), mirroring the ECS
      # task's litestream sidecar (terraform/modules/compute/ecs/main.tf).
      # Shares the same PVC as the backend container.
      - name: litestream
        image: litestream/litestream:0.3.13
        imagePullPolicy: IfNotPresent
        args:
        - replicate
        - /data/payraider.db
        - $(LITESTREAM_REPLICA_URL)
        env:
        - name: LITESTREAM_S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: litestream-s3-bucket
        - name: LITESTREAM_S3_PATH
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: litestream-s3-path
        - name: LITESTREAM_REPLICA_URL
          value: "s3://$(LITESTREAM_S3_BUCKET)/$(LITESTREAM_S3_PATH)"
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: payraider-config
              key: aws-region
        # On EKS, prefer IRSA on the payraider-backend ServiceAccount
        # instead of these static keys (see secret-template.yaml).
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: payraider-secrets
              key: litestream-aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: payraider-secrets
              key: litestream-aws-secret-access-key
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: data
          mountPath: /data
        - name: litestream-tmp
          mountPath: /tmp

      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: litestream-tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: payraider-backend-data
      
      # Pod scheduling
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
      
      # Tolerations for node taints
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      
      # DNS configuration
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
