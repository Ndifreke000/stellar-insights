name: Rust Lint

# Consolidates the old `Format Check` and `Clippy` workflows (fmt.yml,
# clippy.yml) into one file. Both ran on identical triggers and only ever
# checked Rust style/lints, so there was no reason for them to be two
# separate workflow files — they stay as two independent jobs here with
# their exact original steps, so PR checks and behavior are unchanged.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Backend Format
      working-directory: ./backend
      run: cargo fmt --all -- --check

    - name: Contracts Format
      working-directory: ./contracts
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Backend Clippy
      working-directory: ./backend
      run: cargo clippy --lib -- -W clippy::all

    - name: Contracts Clippy
      working-directory: ./contracts
      run: cargo clippy --all-targets --all-features -- -W clippy::all
      continue-on-error: true
