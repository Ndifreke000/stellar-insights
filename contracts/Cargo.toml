[workspace]
resolver = "2"
members = [
  "payraider",
  "benches",
  "tests",
]
# Only payraider is integrated with the backend (SNAPSHOT_CONTRACT_ID).
# Other contract crates remain in contracts/ for reference but are excluded
# from the workspace so CI does not build or test dead code. See archive/README.md.
default-members = [
  "payraider",
]

# Clippy linting configuration for all contracts
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
soroban-sdk = "27.0.2"
soroban-token-sdk = "27.0.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.bench]
opt-level = 3
debug = false

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
