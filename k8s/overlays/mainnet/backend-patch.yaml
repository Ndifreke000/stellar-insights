apiVersion: apps/v1
kind: Deployment
metadata:
  name: payraider-backend
  namespace: payraider-mainnet
spec:
  # Pinned to 1: SQLite (docs/adr/0001-sqlite-vs-postgres.md) permits
  # exactly one writer and there is no shared storage for multiple
  # replicas to safely share one database file.
  replicas: 1
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: component
                operator: In
                values:
                - backend
            topologyKey: kubernetes.io/hostname
      containers:
      - name: backend
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
