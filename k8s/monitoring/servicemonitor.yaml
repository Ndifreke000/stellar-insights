apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payraider-backend
  namespace: payraider
  labels:
    app: payraider
    component: backend
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: payraider
      component: backend
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
---
apiVersion: v1
kind: Service
metadata:
  name: payraider-backend-metrics
  namespace: payraider
  labels:
    app: payraider
    component: backend
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: payraider
    component: backend
