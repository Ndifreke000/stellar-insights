[workspace]
resolver = "2"
members = [
  "payraider",
  "benches",
  "tests",
]
# Only payraider is integrated with the backend (SNAPSHOT_CONTRACT_ID).
# Every other contract crate lives under contracts/archive/ and is excluded
# from the workspace so CI does not build, lint or test dead code.
# See archive/README.md.
exclude = [
  "archive",
]
default-members = [
  "payraider",
]

# Clippy linting configuration for all contracts
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
soroban-sdk = "29.0.1"
soroban-token-sdk = "27.0.2"

# Reproducible release profile for deployable WASM (issue #2880).
# These flags are what make two independent builds produce an identical
# WASM hash; do not relax them without updating the verification docs.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
# Deterministic output: no incremental artifacts, no build-path leakage.
incremental = false
rpath = false

[profile.bench]
opt-level = 3
debug = false

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
