name: Gas Benchmarks

on:
  push:
    branches: [ main, develop ]
    paths: [ 'contracts/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'contracts/**' ]

jobs:
  gas:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Run gas benchmarks
      working-directory: ./contracts
      shell: bash  # enables pipefail so tee doesn't mask failures
      run: cargo bench -p contract-benches --bench gas_benchmarks | tee gas-report.txt

    - name: Upload gas report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gas-report
        path: contracts/gas-report.txt
