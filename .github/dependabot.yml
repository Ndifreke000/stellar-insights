version: 2
updates:
  # Backend Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
      - "backend"
    groups:
      rust-patch-updates:
        update-types:
          - "patch"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
    groups:
      # react and react-dom must always be the exact same version.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # next and its companion packages share one version.
      nextjs:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      npm-patch-updates:
        update-types:
          - "patch"

  # Smart contracts Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/contracts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "contracts"

  # Mobile npm dependencies
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "mobile"
    ignore:
      # React Native's babel preset (Babel 7) still resolves @babel/runtime/regenerator,
      # which Babel 8 removed; the dev bundle fails to build on 8.x (see #2937).
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      # @react-native/babel-preset's plugins assert Babel "^7.0.0-0"; loading
      # them under @babel/core 8 makes every jest/metro transform fail.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
      # @react-native/eslint-config peers on eslint ^8 || ^9; its bundled
      # plugins (eslint-comments, @babel/eslint-parser) crash under eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # SDK TypeScript npm dependencies
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "sdk"
    ignore:
      # openapi-typescript (types generator) only supports TypeScript 5.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # SDK Python dependencies
  - package-ecosystem: "pip"
    directory: "/sdk/python"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
      - "sdk"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
