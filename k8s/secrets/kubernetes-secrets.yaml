# Hardened Kubernetes Secret and RBAC policies for PayRaider production
# NEVER commit plaintext production secrets to version control.
apiVersion: v1
kind: Secret
metadata:
  name: payraider-secrets
  namespace: payraider
  labels:
    app: payraider
    component: secrets-management
type: Opaque
stringData:
  # Sensitive environment variables injected into the backend container
  database-url: "sqlite:///data/payraider.db"
  redis-url: "redis://redis:6379"
  jwt-secret: "CHANGE_ME_generate_with_openssl_rand_base64_48"
  encryption-key: "CHANGE_ME_generate_with_openssl_rand_hex_32"
  sep10-server-public-key: "GXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  sep10-home-domain: "payraider.com"
  stellar-source-secret-key: "SXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  price-feed-api-key: ""
  slack-webhook-url: ""
  telegram-bot-token: ""
---
# RBAC: Restrict Secret read permissions strictly to the backend ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payraider-secret-reader
  namespace: payraider
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["payraider-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payraider-secret-reader-binding
  namespace: payraider
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: payraider-secret-reader
subjects:
  - kind: ServiceAccount
    name: payraider-backend
    namespace: payraider
