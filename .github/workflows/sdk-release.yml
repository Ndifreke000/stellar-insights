# SDK releases with changesets (#2595). Runbook: sdk/RELEASING.md
#
# - PRs touching sdk/**: check the compatibility matrix is in sync.
# - Push to main with pending changesets: open/update the "Version Packages"
#   PR (bumps versions, writes CHANGELOGs, regenerates sdk/COMPATIBILITY.md).
# - Push to main after that PR merges: publish npm packages whose version is
#   not on the registry yet, tag them, then publish the Python SDK to PyPI.
name: SDK release

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "contracts/Cargo.toml"
      - "contracts/payraider/Cargo.toml"
      - ".github/workflows/sdk-release.yml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-release.yml"
  workflow_dispatch:

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: sdk

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - name: Compatibility matrix is in sync with package versions
        run: npm run compat:check
      - name: Pending changesets
        run: npx changeset status --since=origin/${{ github.base_ref }} || echo "::notice::No changeset in this PR. Add one with 'cd sdk && npx changeset' if a published SDK changed."

  release:
    if: github.event_name != 'pull_request' && github.repository == 'Ndifreke000/stellar-insights'
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits + tags
      pull-requests: write # Version Packages PR
      id-token: write # npm provenance
    outputs:
      # 'false' means no changesets were pending, so the publish step ran.
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            sdk/typescript/package-lock.json
            sdk/react/package-lock.json
            sdk/mcp-server/package-lock.json
      - run: npm ci
      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          cwd: sdk
          version: npm run version-packages
          publish: npm run release
          title: "chore(sdk): version packages"
          commit: "chore(sdk): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  python:
    needs: release
    # Runs on every publish pass (not only when npm published) so a
    # Python-only bump is released too; skip-existing makes it idempotent.
    if: needs.release.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          skip-existing: true
