apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payraider-backend
  namespace: payraider
  labels:
    app: payraider
    component: backend
spec:
  minAvailable: 2  # Always keep at least 2 pods running
  selector:
    matchLabels:
      app: payraider
      component: backend
  unhealthyPodEvictionPolicy: IfHealthyBudget
