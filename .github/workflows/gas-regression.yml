name: Gas Regression

on:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '!contracts/archive/**'
      - 'scripts/check_gas_regression.py'
      - 'docs/GAS_COSTS.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '!contracts/archive/**'
      - 'scripts/check_gas_regression.py'
      - 'docs/GAS_COSTS.md'

jobs:
  gas-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: contracts-gas-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: contracts-gas-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Host-budget CPU instructions / memory bytes per payraider entrypoint.
      # Deterministic, unlike wall-clock timings, so a tight threshold is safe.
      - name: Measure gas per entrypoint
        working-directory: ./contracts
        shell: bash  # enables pipefail so tee doesn't mask a failed build
        run: |
          cargo bench -p contract-benches --bench gas_benchmarks | tee gas_output.txt

      # Fails if any entrypoint's CPU or memory cost rose by more than its
      # threshold in contracts/benches/gas-thresholds.toml (10% by default)
      # over the baseline in docs/GAS_COSTS.md.
      - name: Check for gas regressions
        working-directory: ./contracts
        run: |
          python3 ../scripts/check_gas_regression.py \
            gas_output.txt \
            ../docs/GAS_COSTS.md \
            --thresholds benches/gas-thresholds.toml

      - name: Upload gas results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-results-${{ github.sha }}
          path: contracts/gas_output.txt
          retention-days: 30

      # On pushes to main, update the baseline in docs/GAS_COSTS.md
      - name: Update gas cost baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ./contracts
        run: |
          python3 ../scripts/check_gas_regression.py \
            gas_output.txt \
            ../docs/GAS_COSTS.md \
            --thresholds benches/gas-thresholds.toml \
            --update-baseline

      - name: Commit updated baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/GAS_COSTS.md
          git diff --cached --quiet || git commit -m "chore: update gas cost baseline [skip ci]"
          git push
