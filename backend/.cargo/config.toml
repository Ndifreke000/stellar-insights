# SQLx checks `query!` macros at compile time. The checked-in .sqlx/ cache lets
# that happen without a database, which is what CI, Docker builds and a fresh
# clone have.
#
# After changing a `query!` macro or a migration, regenerate the cache:
#   DATABASE_URL=sqlite://<a migrated database> cargo sqlx prepare -- --all-targets
# and commit the updated .sqlx/ directory.
#
# To check against a live database instead, run with SQLX_OFFLINE=false and
# DATABASE_URL set.
[env]
SQLX_OFFLINE = "true"
