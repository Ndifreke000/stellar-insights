name: Plugin (MCP server)

# Builds and tests the TypeScript SDK and the MCP server, builds the plugin's
# bundled server from source, and builds the Docker image. On main it then
# publishes the plugin, bundle included, to the plugin-dist branch that the
# marketplace installs from. The bundle is never committed to main, so every
# change to it is reviewed as source in sdk/mcp-server.

on:
  push:
    branches: [main]
    paths:
      - 'sdk/typescript/**'
      - 'sdk/mcp-server/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'sdk/typescript/**'
      - 'sdk/mcp-server/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sdk/mcp-server/package-lock.json

      - name: Build and test the SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Install the MCP server
        working-directory: sdk/mcp-server
        run: npm ci

      - name: Lint
        working-directory: sdk/mcp-server
        run: npm run lint

      - name: Test
        working-directory: sdk/mcp-server
        run: npm test

      - name: Build
        working-directory: sdk/mcp-server
        run: npm run build

      - name: Smoke-test the built server
        working-directory: sdk/mcp-server
        run: npm run smoke-test

      - name: Build the plugin's bundled server
        working-directory: sdk/mcp-server
        run: npm run build:plugin

      - name: Smoke-test the plugin's bundled server
        working-directory: sdk/mcp-server
        run: node scripts/smoke-test.mjs ../../plugins/payraider/server/server.mjs

      - name: Validate plugin and marketplace manifests
        run: |
          for file in plugins/payraider/.claude-plugin/plugin.json plugins/payraider/.mcp.json .claude-plugin/marketplace.json; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" && echo "ok $file"
          done
          node -e "
            const p = require('./plugins/payraider/.claude-plugin/plugin.json');
            const s = require('./sdk/mcp-server/package.json');
            if (p.version !== s.version) { console.error('plugin version ' + p.version + ' != server version ' + s.version); process.exit(1); }
          "

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f sdk/mcp-server/Dockerfile -t payraider-mcp:ci sdk

      - name: Start it and probe the health endpoint
        run: |
          docker run -d --name mcp -p 3333:3333 -e PAYRAIDER_BASE_URL=http://127.0.0.1:1 payraider-mcp:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3333/healthz; then exit 0; fi
            sleep 1
          done
          docker logs mcp
          exit 1

  publish-plugin:
    name: Publish plugin to plugin-dist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, docker]
    permissions:
      contents: write
    concurrency:
      group: publish-plugin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sdk/mcp-server/package-lock.json

      - name: Build the bundle from source
        run: |
          (cd sdk/typescript && npm ci && npm run build)
          (cd sdk/mcp-server && npm ci && npm run build:plugin)

      - name: Smoke-test the bundle
        working-directory: sdk/mcp-server
        run: node scripts/smoke-test.mjs ../../plugins/payraider/server/server.mjs

      # plugin-dist holds the plugin at its root (manifest, .mcp.json,
      # skills, commands and server/server.mjs) and nothing else. Each commit
      # names the main commit it was built from.
      - name: Commit and push to plugin-dist
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          dist="$RUNNER_TEMP/plugin-dist"
          if git fetch --depth=1 origin plugin-dist:refs/remotes/origin/plugin-dist; then
            git worktree add -B plugin-dist "$dist" origin/plugin-dist
          else
            git worktree add --orphan -b plugin-dist "$dist"
          fi
          find "$dist" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R plugins/payraider/. "$dist/"
          test -f "$dist/server/server.mjs" || { echo "::error::bundle missing from the plugin build"; exit 1; }

          cd "$dist"
          git add -A
          if git diff --cached --quiet; then
            echo "plugin-dist is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Build plugin from ${SOURCE_SHA}" \
            -m "Generated by .github/workflows/plugin.yml from sdk/mcp-server at ${SOURCE_SHA}. Do not edit this branch; change main instead."
          git push origin plugin-dist
