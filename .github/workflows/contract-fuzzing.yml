name: Contract Fuzzing

on:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '!contracts/archive/**'
  pull_request:
    paths:
      - 'contracts/**'
      - '!contracts/archive/**'
  workflow_dispatch:

jobs:
  fuzz:
    name: Property-based & Fuzz Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-contracts-fuzz-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-contracts-fuzz-

      - name: Run payraider contract tests
        working-directory: contracts
        run: cargo test --workspace -- --nocapture

      # RBAC invariant fuzzing (#2785): larger budget than the default test
      # run, hard-capped in wall-clock time. A failure prints its seed; check
      # it into REGRESSION_SEEDS in contracts/tests/fuzz/rbac_invariants.rs.
      - name: RBAC invariant fuzzing (time-boxed)
        working-directory: contracts
        timeout-minutes: 10
        env:
          RBAC_FUZZ_CASES: '400'
          RBAC_FUZZ_STEPS: '120'
        run: cargo test -p contract-integration-tests --test fuzz rbac_invariants -- --nocapture
