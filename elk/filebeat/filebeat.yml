---
## Filebeat configuration for Stellar Insights

# Enable Docker support
filebeat.inputs:
  - type: docker
    enabled: true
    containers.ids:
      - "*"
    containers.stream: all
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: false

# Parse JSON logs
processors:
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: false

# Forward to Logstash
output.logstash:
  hosts: ["logstash:5000"]
  codec.format.string: "%{[@timestamp]} %{message}"

logging.level: info
logging.to_files: false
